name: REL-UI-01 General-only frontend

on:
  push:
    branches:
      - rel-ui-01-general-only-20261105
      - rel-ui-01-general-safeguards-20261106
      - release/rel-general-conservative-20261106
  pull_request:
    paths:
      - 'src/pages/GeneralCorrelationAnalysis.tsx'
      - 'src/lib/generalCorrelationContract.ts'
      - 'src/lib/generalWordExport.ts'
      - 'src/lib/generalCorrelationCautions.ts'
      - 'src/App.tsx'
      - 'src/components/layout/Layout.tsx'
      - 'src/components/vivasense/workspace/v3/**'
      - '.github/workflows/rel-ui-01-general-only.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: General-only and legacy-identity tests
        run: >-
          npm test --
          src/lib/generalCorrelationContract.test.ts
          src/lib/generalWordExport.test.ts
          src/pages/__tests__/GeneralCorrelationAnalysis.test.tsx
          src/pages/__tests__/GeneralCorrelationSafeguards.test.tsx
          src/test/legacyGeneticConsumersUnchanged.test.ts
          src/components/layout/__tests__/Layout.navigation.test.tsx
          src/components/vivasense/workspace/v3/__tests__/generalCorrelationEntry.test.tsx
      - name: Full frontend suite (no failures or skips expected)
        run: npm test
      - name: Build production bundle
        run: npm run build
