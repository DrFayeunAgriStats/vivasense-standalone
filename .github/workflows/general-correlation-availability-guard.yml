name: General Correlation Availability Guard

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  general-correlation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # Test-only placeholders: never use production Supabase credentials in CI.
      VITE_SUPABASE_URL: https://ci-only-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-only-public-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prevent deletion of released module and new features
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=(p)=>fs.readFileSync(p,'utf8');
          const app=read('src/App.tsx');
          const nav=read('src/components/layout/Layout.tsx');
          const dashboard=read('src/components/vivasense/workspace/v3/WorkspaceV3Dashboard.tsx');
          assert.ok(app.includes('path="/relationship-analysis/general"'));
          assert.ok(app.includes('GeneralCorrelationAnalysis'));
          assert.ok(nav.includes('nav-general-correlation'));
          assert.ok(dashboard.includes('<GeneralCorrelationCard />'));
          assert.ok(app.includes('<SupportPilot />'));
          assert.ok(read('src/pages/HelpLearning.tsx').includes('SampleDatasets'));
          assert.ok(fs.existsSync('src/pages/GeneralCorrelationAnalysis.tsx'));
          const workspacePage=read('src/pages/VivaSenseWorkspace.tsx');
          const onboarding=read('src/components/vivasense/workspace/v3/OnboardingModules.tsx');
          const guides=read('src/data/helpLearningContent.ts');
          const ask=read('src/components/help/AskVivaSense.tsx');
          assert.ok(nav.includes('label: "ANOVA & Mean Separation"'));
          assert.ok(nav.includes('Research Tools'));
          assert.ok(onboarding.includes('name: "ANOVA & Mean Separation"'));
          assert.ok(onboarding.includes('Research Tools'));
          assert.ok(workspacePage.includes('ANOVA &amp; Mean Separation'));
          assert.ok(workspacePage.includes('Statistical Analysis'));
          assert.ok(workspacePage.includes('Design &amp; Planning'));
          assert.ok(workspacePage.includes('Analysis of designed experiments'));
          assert.ok(workspacePage.includes('Randomise and lay out a chosen design.'));
          assert.ok(guides.includes('Open ANOVA & Mean Separation from the sidebar.'));
          assert.ok(guides.includes('title: "Choose the Correct Experimental Design"'));
          assert.ok(guides.includes('Choose the experimental design that matches'));
          assert.ok(ask.includes('label: "ANOVA & Mean Separation"'));
          assert.ok(!guides.includes('Experimental Design & ANOVA'));
          assert.ok(!workspacePage.includes('Experimental Design & ANOVA'));
          console.log('PASS: General Correlation, Ask VivaSense, sample datasets and research-stage names');
          NODE
      - name: Targeted General Correlation tests
        run: npx vitest run src/pages/__tests__/GeneralCorrelationAnalysis.test.tsx src/pages/__tests__/GeneralCorrelationPresentation.test.tsx src/pages/__tests__/GeneralCorrelationSafeguards.test.tsx src/components/layout/__tests__/Layout.navigation.test.tsx src/components/vivasense/workspace/v3/__tests__/generalCorrelationEntry.test.tsx src/lib/generalCorrelationContract.test.ts src/lib/generalWordExport.test.ts
      # The three excluded files have existing failures on the unmodified master
      # and are outside this frontend-only General Correlation restoration.
      # Keep their failures visible below, but gate all other tests.
      - name: Frontend suite excluding three unrelated baseline failures
        run: npx vitest run --exclude src/components/vivasense/crop-protection/__tests__/navigation.test.tsx --exclude src/components/vivasense/genetics-params/__tests__/anovaDesigns.test.ts --exclude src/components/vivasense/genetics-params/__tests__/designRoleIdentity.test.ts
      - name: Document known master baseline failures (non-gating)
        continue-on-error: true
        run: npx vitest run src/components/vivasense/crop-protection/__tests__/navigation.test.tsx src/components/vivasense/genetics-params/__tests__/anovaDesigns.test.ts src/components/vivasense/genetics-params/__tests__/designRoleIdentity.test.ts
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
