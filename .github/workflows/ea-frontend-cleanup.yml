name: Early Access frontend cleanup

on:
  push:
    branches:
      - release/ea-remove-commercial-gates-frontend-20261013

permissions:
  contents: write

jobs:
  cleanup-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: release/ea-remove-commercial-gates-frontend-20261013
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write Early Access compatibility layers
        shell: bash
        run: |
          set -euo pipefail
          cat > src/lib/vivasenseGating.ts <<'EOF'
          /**
           * Early Access compatibility layer.
           * Commercial tiers are disabled; legacy mode values remain only for
           * caller/header compatibility. Scientific validation is elsewhere.
           */
          export type VivaSenseMode = "free" | "pro";
          const STORAGE_KEY = "vivasense_mode";
          const MODE_CHANGE_EVENT = "vivasense:mode-change";

          export function getVivaSenseMode(): VivaSenseMode { return "pro"; }

          export function setVivaSenseMode(_mode: VivaSenseMode): void {
            if (typeof window === "undefined") return;
            try {
              window.localStorage.setItem(STORAGE_KEY, "pro");
              window.dispatchEvent(new CustomEvent(MODE_CHANGE_EVENT, { detail: "pro" }));
            } catch { /* storage may be unavailable */ }
          }

          export function subscribeVivaSenseMode(cb: (mode: VivaSenseMode) => void): () => void {
            if (typeof window === "undefined") return () => {};
            const onMode = () => cb("pro");
            window.addEventListener(MODE_CHANGE_EVENT, onMode);
            window.addEventListener("storage", onMode);
            return () => {
              window.removeEventListener(MODE_CHANGE_EVENT, onMode);
              window.removeEventListener("storage", onMode);
            };
          }

          export type ProGuardKey =
            | "anova_combined" | "anova_multi_environment" | "anova_gxe"
            | "genetic_parameters" | "pca" | "path_analysis" | "clustering"
            | "selection_index" | "stability" | "ammi" | "gge" | "molecular"
            | "regression" | "export_word" | "advanced_interpretation";

          export interface ProGuardInfo {
            key: ProGuardKey;
            title: string;
            description: string;
          }

          const TITLES: Record<ProGuardKey, string> = {
            anova_combined: "Combined ANOVA",
            anova_multi_environment: "Multi-environment ANOVA",
            anova_gxe: "Genotype × Environment Analysis",
            genetic_parameters: "Genetic Parameters & Heritability",
            pca: "Principal Component Analysis",
            path_analysis: "Path Analysis",
            clustering: "Cluster Analysis",
            selection_index: "Selection Index / MGIDI",
            stability: "Stability Analysis",
            ammi: "AMMI Analysis",
            gge: "GGE Biplot",
            molecular: "Molecular Marker Analysis",
            regression: "Multiple Regression",
            export_word: "Word Export",
            advanced_interpretation: "Advanced AI Interpretation",
          };

          export const getProGuardInfo = (key: ProGuardKey): ProGuardInfo => ({
            key,
            title: TITLES[key],
            description: "Available during Early Access.",
          });

          export function classifyAnovaRequest(
            _analysisType: string,
            _formData: FormData,
          ): ProGuardInfo | null { return null; }

          export function classifyGeneticsRequest(
            _analysisType: string,
          ): ProGuardInfo | null { return null; }

          export const isProMode = (): boolean => true;
          EOF

          cat > src/services/featureMode.ts <<'EOF'
          /** Early Access mode compatibility. No commercial decision is made here. */
          export type VivaSenseMode = "free" | "pro";
          export const VIVASENSE_MODE_KEY = "vivasense_mode";
          export const VIVASENSE_EXPIRES_KEY = "vivasense_pro_expires_at";
          export const VIVASENSE_DEFAULT_MODE: VivaSenseMode = "pro";
          export const BOOK_DATA_CLINIC_URL =
            "https://wa.me/2349022158026?text=Hello%20VivaSense%2C%20I%20want%20to%20book%20a%20Data%20Clinic%20session.";
          export const VIVASENSE_MODE_CHANGED_EVENT = "vivasense-mode-changed";
          export const VIVASENSE_USER_KEY = "vivasense_user";

          function canUseLocalStorage(): boolean {
            return typeof window !== "undefined" && typeof window.localStorage !== "undefined";
          }

          export function getProExpiresAt(): string | null { return null; }

          export function initializeVivaSenseMode(): VivaSenseMode {
            if (canUseLocalStorage()) {
              window.localStorage.setItem(VIVASENSE_MODE_KEY, "pro");
              window.localStorage.removeItem(VIVASENSE_EXPIRES_KEY);
            }
            return "pro";
          }

          export function getVivaSenseMode(): VivaSenseMode { return "pro"; }

          export function setVivaSenseMode(
            _mode: VivaSenseMode,
            _expiresAt: string | null = null,
          ): void {
            if (!canUseLocalStorage()) return;
            window.localStorage.setItem(VIVASENSE_MODE_KEY, "pro");
            window.localStorage.removeItem(VIVASENSE_EXPIRES_KEY);
            window.dispatchEvent(new Event(VIVASENSE_MODE_CHANGED_EVENT));
          }

          export function subscribeVivaSenseMode(
            cb: (mode: VivaSenseMode) => void,
          ): () => void {
            if (typeof window === "undefined") return () => {};
            const handler = () => cb("pro");
            window.addEventListener(VIVASENSE_MODE_CHANGED_EVENT, handler);
            return () => window.removeEventListener(VIVASENSE_MODE_CHANGED_EVENT, handler);
          }

          export async function redeemProCode(_code: string): Promise<
            | { ok: true; expires_at: string; already_redeemed?: boolean }
            | { ok: false; error: string }
          > {
            setVivaSenseMode("pro");
            return { ok: true, expires_at: "9999-12-31T23:59:59.999Z", already_redeemed: true };
          }

          export async function syncProAccessFromServer(): Promise<{
            mode: VivaSenseMode;
            expiresAt: string | null;
          }> {
            initializeVivaSenseMode();
            return { mode: "pro", expiresAt: null };
          }

          export function isProMode(): boolean { return true; }
          export function modeLabel(_mode: VivaSenseMode): string { return "Early Access"; }

          export class ProFeatureError extends Error {
            code: string;
            featureName: string;
            constructor(featureName: string) {
              super("This feature is unavailable");
              this.name = "ProFeatureError";
              this.code = "PRO_FEATURE";
              this.featureName = featureName;
            }
          }

          export function guardProModule(_moduleName: string): void {
            // Commercial restrictions are disabled during Early Access.
          }
          export function ensureProAccess(featureName: string): void { guardProModule(featureName); }

          export function setVivaSenseUser(identity: string | null): void {
            if (!canUseLocalStorage()) return;
            const trimmed = identity?.trim();
            if (trimmed) window.localStorage.setItem(VIVASENSE_USER_KEY, trimmed);
            else window.localStorage.removeItem(VIVASENSE_USER_KEY);
          }

          export function getVivaSenseUser(): string | null {
            if (!canUseLocalStorage()) return null;
            const stored = window.localStorage.getItem(VIVASENSE_USER_KEY)?.trim();
            return stored ? stored : null;
          }

          export function buildModeHeaders(baseHeaders?: HeadersInit): Headers {
            const headers = new Headers(baseHeaders);
            headers.set("X-VivaSense-Mode", "pro");
            const identity = getVivaSenseUser();
            if (identity) headers.set("X-VivaSense-User", identity);
            return headers;
          }

          /** @deprecated Commercial activation is disabled during Early Access. */
          export function activateProWithCode(_code: string): boolean {
            setVivaSenseMode("pro");
            return true;
          }
          EOF

          cat > src/components/vivasense/VivaSensePlanBadge.tsx <<'EOF'
          import { Badge } from "@/components/ui/badge";

          export function VivaSensePlanBadge() {
            return (
              <div className="flex items-center gap-2">
                <span className="text-xs text-muted-foreground hidden sm:inline">
                  All implemented modules available for testing
                </span>
                <Badge
                  variant="default"
                  className="text-white border-transparent hover:opacity-90"
                  style={{ backgroundColor: "#1B5E20" }}
                >
                  Early Access
                </Badge>
              </div>
            );
          }
          EOF

      - name: Remove Field Data commercial mode UI
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/vivasense/FieldDataCollection.tsx")
          text = p.read_text()
          replacements = [
              ('import { getVivaSenseMode, subscribeVivaSenseMode, type VivaSenseMode } from "@/lib/vivasenseGating";\n', ''),
              ('  const [mode, setMode] = useState<VivaSenseMode>(() => getVivaSenseMode());\n  const isPro = mode === "pro";\n\n', ''),
              ('  useEffect(() => {\n    const unsubscribe = subscribeVivaSenseMode(setMode);\n    return unsubscribe;\n  }, []);\n\n', ''),
              ('Mode: {isPro ? "Pro" : "Free"} · This module is free for all users.', 'Early Access · Available to all testers.'),
          ]
          for old, new in replacements:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"FieldDataCollection expected one match, found {n}: {old[:80]!r}")
              text = text.replace(old, new)
          p.write_text(text)

      - name: Remove Field Layout commercial UI only
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/vivasense/FieldLayoutGenerator.tsx")
          text = p.read_text()

          def one(old: str, new: str = ""):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"FieldLayout expected one match, found {n}: {old[:90]!r}")
              text = text.replace(old, new)

          one('  const selectedDesign = useMemo(() => DESIGNS.find((d) => d.value === design), [design]);\n')
          one('    if (selectedDesign?.requiresPro && !isPro) {\n      return "This design is available in VivaSense Pro only.";\n    }\n')
          one('Generate randomized field layouts for classic and Pro experimental designs.',
              'Generate randomized field layouts for supported experimental designs.')
          one('\n                  disabled={d.requiresPro && !isPro}')
          one('{d.label} - {d.desc}{d.requiresPro ? " [Pro]" : ""}', '{d.label} - {d.desc}')
          one('                (selectedDesign?.requiresPro && !isPro) ||\n')

          start_marker = '            <div className="mt-2 flex flex-wrap gap-2">'
          alert_marker = '            {selectedDesign?.requiresPro && !isPro && ('
          start = text.find(start_marker)
          alert = text.find(alert_marker, start + 1)
          if start < 0 or alert < 0:
              raise SystemExit(f"FieldLayout commercial UI markers missing: start={start}, alert={alert}")
          close_marker = '            )}\n'
          close = text.find(close_marker, alert + len(alert_marker))
          if close < 0:
              raise SystemExit("FieldLayout commercial alert closing marker missing")
          text = text[:start] + text[close + len(close_marker):]

          residual = [
              s for s in [
                  "[Pro]", "Pro feature.", "Upgrade to VivaSense Pro",
                  "classic and Pro experimental designs", "available in VivaSense Pro only",
              ] if s in text
          ]
          if residual:
              raise SystemExit(f"FieldLayout residual commercial wording: {residual}")
          p.write_text(text)

      - name: Verify intended source-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(src/lib/vivasenseGating.ts|src/services/featureMode.ts|src/components/vivasense/VivaSensePlanBadge.tsx|src/components/vivasense/FieldDataCollection.tsx|src/components/vivasense/FieldLayoutGenerator.tsx)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run focused scientific-entry tests
        run: npx vitest run src/components/vivasense/workspace/v3/__tests__/studyOnboarding.test.tsx src/components/vivasense/genetics-params/__tests__/anovaSingleEntryPoint.test.ts

      - name: Commit validated cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ea-frontend-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(src/lib/vivasenseGating.ts|src/services/featureMode.ts|src/components/vivasense/VivaSensePlanBadge.tsx|src/components/vivasense/FieldDataCollection.tsx|src/components/vivasense/FieldLayoutGenerator.tsx|.github/workflows/ea-frontend-cleanup.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected staged files:"; echo "$unexpected"; exit 1; }
          git commit -m "Early Access: remove frontend commercial gating"
          git push origin HEAD:release/ea-remove-commercial-gates-frontend-20261013
