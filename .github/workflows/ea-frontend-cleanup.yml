name: Early Access frontend cleanup

on:
  push:
    branches:
      - release/ea-remove-commercial-gates-frontend-20261013

permissions:
  contents: write

jobs:
  cleanup-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: release/ea-remove-commercial-gates-frontend-20261013
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fail-closed Early Access cleanup
        shell: bash
        run: |
          set -euo pipefail

          cat > src/lib/vivasenseGating.ts <<'EOF'
          /**
           * VivaSense Early Access compatibility layer.
           *
           * Commercial tiers are intentionally disabled during Early Access.
           * The legacy "free" | "pro" type is retained only so existing callers
           * and backend headers remain compatible while every implemented module
           * is available to testers. Scientific/design/data validation lives in
           * the analysis modules and is not changed here.
           */
          export type VivaSenseMode = "free" | "pro";

          const STORAGE_KEY = "vivasense_mode";
          const MODE_CHANGE_EVENT = "vivasense:mode-change";

          export function getVivaSenseMode(): VivaSenseMode {
            return "pro";
          }

          export function setVivaSenseMode(_mode: VivaSenseMode): void {
            if (typeof window === "undefined") return;
            try {
              window.localStorage.setItem(STORAGE_KEY, "pro");
              window.dispatchEvent(new CustomEvent(MODE_CHANGE_EVENT, { detail: "pro" }));
            } catch {
              // Storage may be unavailable; Early Access remains unrestricted.
            }
          }

          export function subscribeVivaSenseMode(cb: (mode: VivaSenseMode) => void): () => void {
            if (typeof window === "undefined") return () => {};
            const handler = () => cb("pro");
            window.addEventListener(MODE_CHANGE_EVENT, handler);
            window.addEventListener("storage", handler);
            return () => {
              window.removeEventListener(MODE_CHANGE_EVENT, handler);
              window.removeEventListener("storage", handler);
            };
          }

          export type ProGuardKey =
            | "anova_combined"
            | "anova_multi_environment"
            | "anova_gxe"
            | "genetic_parameters"
            | "pca"
            | "path_analysis"
            | "clustering"
            | "selection_index"
            | "stability"
            | "ammi"
            | "gge"
            | "molecular"
            | "regression"
            | "export_word"
            | "advanced_interpretation";

          export interface ProGuardInfo {
            key: ProGuardKey;
            title: string;
            description: string;
          }

          const TITLES: Record<ProGuardKey, string> = {
            anova_combined: "Combined ANOVA",
            anova_multi_environment: "Multi-environment ANOVA",
            anova_gxe: "Genotype × Environment Analysis",
            genetic_parameters: "Genetic Parameters & Heritability",
            pca: "Principal Component Analysis",
            path_analysis: "Path Analysis",
            clustering: "Cluster Analysis",
            selection_index: "Selection Index / MGIDI",
            stability: "Stability Analysis",
            ammi: "AMMI Analysis",
            gge: "GGE Biplot",
            molecular: "Molecular Marker Analysis",
            regression: "Multiple Regression",
            export_word: "Word Export",
            advanced_interpretation: "Advanced AI Interpretation",
          };

          export const getProGuardInfo = (key: ProGuardKey): ProGuardInfo => ({
            key,
            title: TITLES[key],
            description: "Available during Early Access.",
          });

          export function classifyAnovaRequest(
            _analysisType: string,
            _formData: FormData,
          ): ProGuardInfo | null {
            return null;
          }

          export function classifyGeneticsRequest(
            _analysisType: string,
          ): ProGuardInfo | null {
            return null;
          }

          export const isProMode = (): boolean => true;
          EOF

          cat > src/services/featureMode.ts <<'EOF'
          /**
           * Early Access access-mode compatibility.
           *
           * The legacy "pro" value and mode header are retained internally so
           * older callers/backends keep working. There is no commercial access
           * decision here during Early Access.
           */
          export type VivaSenseMode = "free" | "pro";

          export const VIVASENSE_MODE_KEY = "vivasense_mode";
          export const VIVASENSE_EXPIRES_KEY = "vivasense_pro_expires_at";
          export const VIVASENSE_DEFAULT_MODE: VivaSenseMode = "pro";
          export const BOOK_DATA_CLINIC_URL =
            "https://wa.me/2349022158026?text=Hello%20VivaSense%2C%20I%20want%20to%20book%20a%20Data%20Clinic%20session.";
          export const VIVASENSE_MODE_CHANGED_EVENT = "vivasense-mode-changed";
          export const VIVASENSE_USER_KEY = "vivasense_user";

          function canUseLocalStorage(): boolean {
            return typeof window !== "undefined" && typeof window.localStorage !== "undefined";
          }

          export function getProExpiresAt(): string | null {
            return null;
          }

          export function initializeVivaSenseMode(): VivaSenseMode {
            if (canUseLocalStorage()) {
              window.localStorage.setItem(VIVASENSE_MODE_KEY, "pro");
              window.localStorage.removeItem(VIVASENSE_EXPIRES_KEY);
            }
            return "pro";
          }

          export function getVivaSenseMode(): VivaSenseMode {
            return "pro";
          }

          export function setVivaSenseMode(
            _mode: VivaSenseMode,
            _expiresAt: string | null = null,
          ): void {
            if (!canUseLocalStorage()) return;
            window.localStorage.setItem(VIVASENSE_MODE_KEY, "pro");
            window.localStorage.removeItem(VIVASENSE_EXPIRES_KEY);
            window.dispatchEvent(new Event(VIVASENSE_MODE_CHANGED_EVENT));
          }

          export function subscribeVivaSenseMode(
            cb: (mode: VivaSenseMode) => void,
          ): () => void {
            if (typeof window === "undefined") return () => {};
            const handler = () => cb("pro");
            window.addEventListener(VIVASENSE_MODE_CHANGED_EVENT, handler);
            return () => window.removeEventListener(VIVASENSE_MODE_CHANGED_EVENT, handler);
          }

          export async function redeemProCode(_code: string): Promise<
            | { ok: true; expires_at: string; already_redeemed?: boolean }
            | { ok: false; error: string }
          > {
            setVivaSenseMode("pro");
            return {
              ok: true,
              expires_at: "9999-12-31T23:59:59.999Z",
              already_redeemed: true,
            };
          }

          export async function syncProAccessFromServer(): Promise<{
            mode: VivaSenseMode;
            expiresAt: string | null;
          }> {
            initializeVivaSenseMode();
            return { mode: "pro", expiresAt: null };
          }

          export function isProMode(): boolean {
            return true;
          }

          export function modeLabel(_mode: VivaSenseMode): string {
            return "Early Access";
          }

          export class ProFeatureError extends Error {
            code: string;
            featureName: string;
            constructor(featureName: string) {
              super("This feature is unavailable");
              this.name = "ProFeatureError";
              this.code = "PRO_FEATURE";
              this.featureName = featureName;
            }
          }

          export function guardProModule(_moduleName: string): void {
            // Commercial access restrictions are disabled during Early Access.
          }

          export function ensureProAccess(featureName: string): void {
            guardProModule(featureName);
          }

          export function setVivaSenseUser(identity: string | null): void {
            if (!canUseLocalStorage()) return;
            const trimmed = identity?.trim();
            if (trimmed) window.localStorage.setItem(VIVASENSE_USER_KEY, trimmed);
            else window.localStorage.removeItem(VIVASENSE_USER_KEY);
          }

          export function getVivaSenseUser(): string | null {
            if (!canUseLocalStorage()) return null;
            const stored = window.localStorage.getItem(VIVASENSE_USER_KEY)?.trim();
            return stored ? stored : null;
          }

          export function buildModeHeaders(baseHeaders?: HeadersInit): Headers {
            const headers = new Headers(baseHeaders);
            headers.set("X-VivaSense-Mode", "pro");
            const identity = getVivaSenseUser();
            if (identity) headers.set("X-VivaSense-User", identity);
            return headers;
          }

          /** @deprecated Commercial activation is disabled during Early Access. */
          export function activateProWithCode(_code: string): boolean {
            setVivaSenseMode("pro");
            return true;
          }
          EOF

          cat > src/components/vivasense/VivaSensePlanBadge.tsx <<'EOF'
          import { Badge } from "@/components/ui/badge";

          export function VivaSensePlanBadge() {
            return (
              <div className="flex items-center gap-2">
                <span className="text-xs text-muted-foreground hidden sm:inline">
                  All implemented modules available for testing
                </span>
                <Badge
                  variant="default"
                  className="text-white border-transparent hover:opacity-90"
                  style={{ backgroundColor: "#1B5E20" }}
                >
                  Early Access
                </Badge>
              </div>
            );
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact match(es), found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new))

          fd = "src/components/vivasense/FieldDataCollection.tsx"
          replace_exact(
              fd,
              '<p className="mt-1 text-xs text-[#285A4B]">Mode: {isPro ? "Pro" : "Free"} · This module is free for all users.</p>',
              '<p className="mt-1 text-xs text-[#285A4B]">Early Access · Available to all testers.</p>',
          )

          fl = "src/components/vivasense/FieldLayoutGenerator.tsx"
          replace_exact(
              fl,
              '  const selectedDesign = useMemo(() => DESIGNS.find((d) => d.value === design), [design]);\n',
              '',
          )
          replace_exact(
              fl,
              '    if (selectedDesign?.requiresPro && !isPro) {\n      return "This design is available in VivaSense Pro only.";\n    }\n',
              '',
          )
          replace_exact(
              fl,
              'Generate randomized field layouts for classic and Pro experimental designs.',
              'Generate randomized field layouts for supported experimental designs.',
          )
          replace_exact(
              fl,
              '''                <option
                  key={d.value}
                  value={d.value}
                  disabled={d.requiresPro && !isPro}
                >
                  {d.label} - {d.desc}{d.requiresPro ? " [Pro]" : ""}
                </option>''',
              '''                <option key={d.value} value={d.value}>
                  {d.label} - {d.desc}
                </option>''',
          )

          p = Path(fl)
          text = p.read_text()
          commercial_ui = re.compile(
              r'\n            <div className="mt-2 flex flex-wrap gap-2">.*?'
              r'\n            \{selectedDesign\?\.requiresPro && !isPro && \(.*?'
              r'\n            \)\}\n',
              re.DOTALL,
          )
          text, count = commercial_ui.subn('\n', text)
          if count != 1:
              raise SystemExit(f"{fl}: expected 1 commercial UI block, found {count}")
          p.write_text(text)

          replace_exact(
              fl,
              '''              disabled={
                isLoading ||
                (selectedDesign?.requiresPro && !isPro) ||
                (design === "lattice" &&
                  (!!latticeOptionsError || !latticeOptions ||
                    (!!selectedLattice && selectedLattice.status !== "supported")))
              }''',
              '''              disabled={
                isLoading ||
                (design === "lattice" &&
                  (!!latticeOptionsError || !latticeOptions ||
                    (!!selectedLattice && selectedLattice.status !== "supported")))
              }''',
          )

          # Fail closed on the exact user-facing commercial strings this release removes.
          checks = {
              "src/components/vivasense/FieldLayoutGenerator.tsx": [
                  "[Pro]",
                  "Pro feature.",
                  "Upgrade to VivaSense Pro",
                  "classic and Pro experimental designs",
                  "available in VivaSense Pro only",
              ],
              "src/components/vivasense/FieldDataCollection.tsx": [
                  'Mode: {isPro ? "Pro" : "Free"}',
                  "This module is free for all users",
              ],
              "src/components/vivasense/VivaSensePlanBadge.tsx": [
                  "Pro Plan",
                  "Free Plan",
              ],
          }
          for path, needles in checks.items():
              contents = Path(path).read_text()
              found = [needle for needle in needles if needle in contents]
              if found:
                  raise SystemExit(f"{path}: residual commercial wording: {found}")

          print("Early Access commercial cleanup replacements applied and verified.")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run focused workspace tests
        run: npm test -- --run src/components/vivasense/workspace/v3/__tests__/studyOnboarding.test.tsx src/components/vivasense/genetics-params/__tests__/anovaSingleEntryPoint.test.ts

      - name: Commit validated cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ea-frontend-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/vivasenseGating.ts \
                  src/services/featureMode.ts \
                  src/components/vivasense/VivaSensePlanBadge.tsx \
                  src/components/vivasense/FieldDataCollection.tsx \
                  src/components/vivasense/FieldLayoutGenerator.tsx \
                  .github/workflows/ea-frontend-cleanup.yml
          git diff --cached --check
          git commit -m "Early Access: remove frontend commercial gating"
          git push origin HEAD:release/ea-remove-commercial-gates-frontend-20261013
